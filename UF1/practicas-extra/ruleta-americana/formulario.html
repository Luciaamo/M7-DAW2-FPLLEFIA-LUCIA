<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc 1 - Ruleta americana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h3 class="card-title text-center">Formulario de Apuestas</h3>
                <form action="index.php" method="post">
                    <div class="mb-3">
                        <label for="tipoApuesta" class="form-label">Tipo de Apuestas</label>
                        <select class="form-select" id="tipoApuesta" name="tipoApuesta">
                            <option selected disabled>Selecciona el tipo de apuesta</option>
                            <option value="sencilla">Sencilla</option>
                            <option value="doble">Doble</option>
                            <option value="triple">Triple</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="aQueApuestas" class="form-label">¿A qué apuestas?</label>
                        <input type="text" class="form-control" id="aQueApuestas" name="aQueApuestas" placeholder="A qué apuestas?">
                    </div>
                    <div class="mb-3">
                        <label for="cantidadDinero" class="form-label">Cantidad de dinero (€)</label>
                        <input type="number" class="form-control" id="cantidadDinero" name="cantidadDinero" placeholder="Cantidad de dinero?" step="0.01" min="1">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
